<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Auth / Registration Screen -->
    <div id="auth-screen" class="auth-container">
        <div class="card">
            <h2>Purple Chat</h2>
            <p>Register or Login via Email</p>
            <input type="email" id="email-input" placeholder="Enter Email Address">
            <input type="password" id="password-input" placeholder="Enter Password">
            <input type="text" id="username-input" placeholder="Enter Display Name">
            <textarea id="bio-input" placeholder="Enter Bio" rows="2"></textarea>
            <input type="text" id="pfp-input" placeholder="Profile Picture Image URL">
            <button onclick="handleLogin()">Start Chatting</button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="chat-container">
        <div class="sidebar">
            <div>
                <h3>My Profile</h3>
                <div class="profile-box">
                    <img id="display-pfp" src="https://via.placeholder.com/70" alt="PFP">
                    <h4 id="display-name">Username</h4>
                    <p id="display-bio">Bio goes here...</p>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <h3>Global Public Room (Unlimited Messaging)</h3>
            </div>
            <div id="messages" class="messages-box">
                <!-- Messages populate here -->
            </div>
            <div class="chat-input-box">
                <input type="text" id="message-input" placeholder="Type your message here..." onkeypress="checkEnter(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
